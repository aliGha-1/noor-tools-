name: Build NOOR TOOLS 2027 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web application
        run: |
          mkdir -p www
          cp index.html www/index.html

          cat > package.json <<'EOF'
          {
            "name": "noor-tools-2027",
            "version": "1.0.0",
            "private": true,
            "description": "NOOR TOOLS 2027 Android application",
            "scripts": {
              "build:android": "npx cap sync android"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.noortools.app2027",
            "appName": "NOOR TOOLS 2027",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6

      - name: Create Android project
        run: npx cap add android

      - name: Synchronize application
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOOR-TOOLS-2027-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
